<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940">
  <defs>
    <style>
      text { font-family: Consolas, 'Courier New', monospace; }
      .room { fill:#171e32; stroke:#a4adbd; stroke-width:2; rx:7; }
      .edge { fill:none; stroke:#929eb0; stroke-width:2; }
      .ghost { fill:#344054; stroke:#acb7c7; stroke-width:1.5; rx:7; }
      .name { fill:#edf1f8; font-size:17px; text-anchor:middle; }
      .caption { fill:#a6b0c0; font-size:16px; }
      .leader { fill:none; stroke:#657389; stroke-width:1; stroke-dasharray:3 5; }
    </style>
  </defs>
  <rect width="1440" height="940" fill="#090e21"/>
  <rect x="24" y="24" width="1392" height="892" rx="12" fill="#10162a" stroke="#33425c"/>
  <text x="58" y="76" fill="#d4e4f6" font-size="26" font-weight="bold">Discovered world</text>
  <g fill="#0b1123" stroke="#3c526b">
    <rect x="756" y="45" width="38" height="36" rx="4"/>
    <rect x="802" y="45" width="38" height="36" rx="4"/>
    <rect x="850" y="45" width="151" height="36" rx="4"/>
    <rect x="1011" y="45" width="105" height="36" rx="4"/>
    <rect x="1126" y="45" width="231" height="36" rx="4" stroke="#27cef0"/>
  </g>
  <g fill="#d2deef" font-size="16" text-anchor="middle">
    <text x="775" y="69">+</text><text x="821" y="69">−</text>
    <text x="925" y="69">Center on me</text><text x="1063" y="69">Fit map</text>
    <text x="1241" y="69">Nearby levels ●</text>
  </g>
  <text x="58" y="126" fill="#92a0b6" font-size="16">Quarter-box overlap · higher floors drawn over lower floors</text>

  <!-- Rooms: 200 × 96. Offset per floor: 150 × 72; overlap: 50 × 24. -->
  <!-- Back-to-front paint order: -2, -1, 0, +1, +2. -->
  <g opacity="0.24" data-level="-2">
    <rect class="ghost" x="800" y="644" width="200" height="96"/>
    <text x="900" y="706" fill="#e0e6ef" font-size="16" text-anchor="middle">Tunnel</text>
  </g>
  <g opacity="0.38" data-level="-1">
    <path class="edge" d="M 850 620 H 910"/>
    <rect class="ghost" x="650" y="572" width="200" height="96"/>
    <rect class="ghost" x="910" y="572" width="200" height="96"/>
    <text x="750" y="626" fill="#e0e6ef" font-size="16" text-anchor="middle">Cellar</text>
    <text x="1010" y="626" fill="#e0e6ef" font-size="16" text-anchor="middle">Wine Store</text>
  </g>
  <g data-level="0">
    <path class="edge" d="M 440 358 H 500 M 700 358 H 760 M 340 406 V 500 M 600 406 V 500"/>
    <rect class="room" x="240" y="310" width="200" height="96"/>
    <rect class="room" x="760" y="310" width="200" height="96"/>
    <rect class="room" x="240" y="500" width="200" height="96"/>
    <rect class="room" x="500" y="500" width="200" height="96"/>
    <rect x="500" y="310" width="200" height="96" rx="7" fill="#14263a" stroke="#27d9fb" stroke-width="3"/>
    <text class="name" x="340" y="365">Library</text>
    <text class="name" x="860" y="365">East Walk</text>
    <text class="name" x="340" y="555">Workshop</text>
    <text class="name" x="600" y="555">Courtyard</text>
    <text x="600" y="350" text-anchor="middle" fill="#65e7ff" font-size="19">Cedar Hall</text>
    <rect x="577" y="368" width="46" height="22" rx="3" fill="#29d4f3"/>
    <text x="600" y="384" text-anchor="middle" fill="#082133" font-size="14" font-weight="bold">YOU</text>
    <text x="682" y="331" text-anchor="end" fill="#65e7ff" font-size="17">↑</text>
    <text x="682" y="522" text-anchor="end" fill="#65e7ff" font-size="17">↓</text>
  </g>
  <!-- These translucent upper rooms intentionally mask parts of floor zero. -->
  <g opacity="0.38" data-level="1">
    <path class="edge" d="M 550 286 H 610"/>
    <rect class="ghost" x="350" y="238" width="200" height="96"/>
    <rect class="ghost" x="610" y="238" width="200" height="96"/>
    <text x="450" y="292" fill="#e0e6ef" font-size="16" text-anchor="middle">Landing</text>
    <text x="710" y="292" fill="#e0e6ef" font-size="16" text-anchor="middle">Guest Room</text>
  </g>
  <g opacity="0.24" data-level="2">
    <rect class="ghost" x="200" y="166" width="200" height="96"/>
    <text x="300" y="220" fill="#e0e6ef" font-size="16" text-anchor="middle">Loft</text>
  </g>

  <g class="caption">
    <text x="62" y="194">+2 · Above</text><path class="leader" d="M 168 189 H 189"/>
    <text x="62" y="278">+1 · Above</text><path class="leader" d="M 168 273 H 336"/>
    <text x="78" y="458" fill="#40dbfb">0 · Current level</text><path class="leader" d="M 271 452 H 319 V 416"/>
    <text x="1170" y="627">−1 · Below</text><path class="leader" d="M 1156 622 H 1122"/>
    <text x="1170" y="716">−2 · Below</text><path class="leader" d="M 1156 711 H 1012"/>
  </g>
  <g fill="#8b9bb1" font-size="15">
    <text x="1020" y="193">↖ Upper floors</text>
    <text x="1020" y="219">faintly overlay current</text>
    <text x="1020" y="266">Layer order, front → back:</text>
    <text x="1020" y="294">+2, +1, 0, −1, −2</text>
  </g>
  <line x1="58" y1="790" x2="1382" y2="790" stroke="#2c3950"/>
  <text x="58" y="830" fill="#d0dae9" font-size="18">Overlap: ¼ box width × ¼ box height · offset: ¾ width + ¾ height</text>
  <text x="58" y="861" fill="#8c9bb2" font-size="15">Same-size boxes · upper/lower floors at 38% opacity, distant floors at 24%</text>
  <text x="1382" y="888" text-anchor="end" fill="#6f809a" font-size="13">Concept preview · v2</text>
</svg>
