<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940">
  <defs>
    <style>
      text { font-family: Consolas, 'Courier New', monospace; }
      .room { fill:#171e32; stroke:#a4adbd; stroke-width:2; rx:7; }
      .edge { fill:none; stroke:#929eb0; stroke-width:2; }
      .ghost { fill:#192132; stroke:#6d7889; stroke-width:1.5; rx:7; }
      .name { fill:#edf1f8; font-size:17px; text-anchor:middle; }
      .caption { fill:#a6b0c0; font-size:16px; }
      .leader { fill:none; stroke:#657389; stroke-width:1; stroke-dasharray:3 5; }
    </style>
  </defs>
  <rect width="1440" height="940" fill="#090e21"/>
  <rect x="24" y="24" width="1392" height="892" rx="12" fill="#10162a" stroke="#33425c"/>
  <text x="58" y="76" fill="#d4e4f6" font-size="26" font-weight="bold">Discovered world</text>
  <g fill="#0b1123" stroke="#3c526b">
    <rect x="756" y="45" width="38" height="36" rx="4"/>
    <rect x="802" y="45" width="38" height="36" rx="4"/>
    <rect x="850" y="45" width="151" height="36" rx="4"/>
    <rect x="1011" y="45" width="105" height="36" rx="4"/>
    <rect x="1126" y="45" width="231" height="36" rx="4" stroke="#27cef0"/>
  </g>
  <g fill="#d2deef" font-size="16" text-anchor="middle">
    <text x="775" y="69">+</text><text x="821" y="69">−</text>
    <text x="925" y="69">Center on me</text><text x="1063" y="69">Fit map</text>
    <text x="1241" y="69">Nearby levels ●</text>
  </g>
  <text x="58" y="126" fill="#92a0b6" font-size="16">Overlapping floors · upper left / lower right</text>

  <!-- Every room is exactly 200 × 96. Adjacent floors shift 100 × 48. -->
  <!-- Distant floors first, current floor last: current rooms stay unobstructed. -->
  <g opacity="0.48" data-level="2">
    <rect class="ghost" x="300" y="214" width="200" height="96"/>
    <text x="316" y="243" fill="#c0c7d2" font-size="16">Loft</text>
  </g>
  <g opacity="0.48" data-level="-2">
    <rect class="ghost" x="700" y="596" width="200" height="96"/>
    <text x="850" y="673" fill="#c0c7d2" font-size="16" text-anchor="middle">Tunnel</text>
  </g>
  <g opacity="0.72" data-level="1">
    <path class="edge" d="M 600 310 H 660"/>
    <rect class="ghost" x="400" y="262" width="200" height="96"/>
    <rect class="ghost" x="660" y="262" width="200" height="96"/>
    <text x="414" y="290" fill="#b9c1cf" font-size="16">Landing</text>
    <text x="674" y="290" fill="#b9c1cf" font-size="16">Guest Room</text>
  </g>
  <g opacity="0.72" data-level="-1">
    <path class="edge" d="M 800 596 H 860"/>
    <rect class="ghost" x="600" y="548" width="200" height="96"/>
    <rect class="ghost" x="860" y="548" width="200" height="96"/>
    <text x="750" y="625" fill="#b9c1cf" font-size="16" text-anchor="middle">Cellar</text>
    <text x="960" y="625" fill="#b9c1cf" font-size="16" text-anchor="middle">Wine Store</text>
  </g>
  <g data-level="0">
    <path class="edge" d="M 440 358 H 500 M 700 358 H 760 M 340 406 V 500 M 600 406 V 500"/>
    <rect class="room" x="240" y="310" width="200" height="96"/>
    <rect class="room" x="760" y="310" width="200" height="96"/>
    <rect class="room" x="240" y="500" width="200" height="96"/>
    <rect class="room" x="500" y="500" width="200" height="96"/>
    <rect x="500" y="310" width="200" height="96" rx="7" fill="#14263a" stroke="#27d9fb" stroke-width="3"/>
    <text class="name" x="340" y="365">Library</text>
    <text class="name" x="860" y="365">East Walk</text>
    <text class="name" x="340" y="555">Workshop</text>
    <text class="name" x="600" y="555">Courtyard</text>
    <text x="600" y="350" text-anchor="middle" fill="#65e7ff" font-size="19">Cedar Hall</text>
    <rect x="577" y="368" width="46" height="22" rx="3" fill="#29d4f3"/>
    <text x="600" y="384" text-anchor="middle" fill="#082133" font-size="14" font-weight="bold">YOU</text>
    <text x="682" y="331" text-anchor="end" fill="#65e7ff" font-size="17">↑</text>
    <text x="682" y="522" text-anchor="end" fill="#65e7ff" font-size="17">↓</text>
  </g>

  <g class="caption">
    <text x="102" y="226">+2 · Above</text><path class="leader" d="M 210 221 H 285"/>
    <text x="102" y="277">+1 · Above</text><path class="leader" d="M 210 272 H 385"/>
    <text x="78" y="458" fill="#40dbfb">0 · Current level</text><path class="leader" d="M 271 452 H 319 V 416"/>
    <text x="1115" y="617">−1 · Below</text><path class="leader" d="M 1100 612 H 1070"/>
    <text x="1115" y="683">−2 · Below</text><path class="leader" d="M 1100 678 H 910"/>
  </g>
  <path d="M 235 191 L 199 174 M 199 174 L 213 174 M 199 174 L 206 187" fill="none" stroke="#8290a5" stroke-width="2"/>
  <text x="249" y="193" fill="#8290a5" font-size="15">Upper floors shift ↖</text>
  <path d="M 1004 706 L 1040 723 M 1040 723 L 1026 723 M 1040 723 L 1033 710" fill="none" stroke="#8290a5" stroke-width="2"/>
  <text x="1070" y="729" fill="#8290a5" font-size="15">Lower floors shift ↘</text>

  <line x1="58" y1="790" x2="1382" y2="790" stroke="#2c3950"/>
  <text x="58" y="830" fill="#d0dae9" font-size="18">Each floor offset: ½ room width + ½ room height</text>
  <text x="58" y="861" fill="#8c9bb2" font-size="15">Same-size boxes · greyed-out surrounding floors · current level drawn in front</text>
  <text x="1382" y="888" text-anchor="end" fill="#6f809a" font-size="13">Concept preview</text>
</svg>
