[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mudd-ai-backend"
version = "0.1.0"
description = "AI-enhanced MUD backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.27.0",
    "sqlalchemy==2.0.23",
    "alembic==1.13.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "asyncpg==0.29.0",
    "python-dotenv==1.2.3",
    "redis==5.0.1",
    "websockets==12.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==4.1.0",
    "pytest-dotenv==0.5.2",
    "httpx==0.25.2",
    "black==26.5.1",
    "ruff==0.1.11",
    "mypy==1.7.1",
    "pip-audit==2.10.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py312"]
