services:
  postgres:
    image: postgres:16-alpine
    container_name: mudai_postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: muduser
      POSTGRES_PASSWORD: mudpass
      POSTGRES_DB: muddb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muduser -d muddb"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mudai_redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mudai_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://muduser:mudpass@postgres:5432/muddb
      REDIS_URL: redis://redis:6379
      AI_PROVIDER: ${AI_PROVIDER:-fake}
      AI_COMMAND_INTERPRETATION_ENABLED: ${AI_COMMAND_INTERPRETATION_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_COMMAND_TIMEOUT_SECONDS: ${AI_COMMAND_TIMEOUT_SECONDS:-5}
      AI_COMMAND_MAX_INPUT_BYTES: ${AI_COMMAND_MAX_INPUT_BYTES:-4096}
      AI_COMMAND_MAX_OUTPUT_TOKENS: ${AI_COMMAND_MAX_OUTPUT_TOKENS:-512}
      AI_COMMAND_MAX_REQUESTS: ${AI_COMMAND_MAX_REQUESTS:-100}
      AI_COMMAND_MAX_CONCURRENT: ${AI_COMMAND_MAX_CONCURRENT:-2}
      APP_ENV: development
      AUTH_SESSION_SECONDS: ${AUTH_SESSION_SECONDS:-86400}
      AUTH_ATTEMPT_LIMIT: ${AUTH_ATTEMPT_LIMIT:-20}
      AUTH_ATTEMPT_WINDOW_SECONDS: ${AUTH_ATTEMPT_WINDOW_SECONDS:-60}
      LOG_LEVEL: INFO
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      MAX_COMMAND_BYTES: ${MAX_COMMAND_BYTES:-4096}
      COMMAND_RATE_LIMIT: ${COMMAND_RATE_LIMIT:-10}
      COMMAND_RATE_WINDOW_SECONDS: ${COMMAND_RATE_WINDOW_SECONDS:-1}
      MAX_WEBSOCKET_CONNECTIONS: ${MAX_WEBSOCKET_CONNECTIONS:-250}
      CONNECTION_ATTEMPT_LIMIT: ${CONNECTION_ATTEMPT_LIMIT:-60}
      CONNECTION_ATTEMPT_WINDOW_SECONDS: ${CONNECTION_ATTEMPT_WINDOW_SECONDS:-60}
      MAX_TRACKED_CLIENT_ADDRESSES: ${MAX_TRACKED_CLIENT_ADDRESSES:-10000}
      OUTBOUND_SEND_TIMEOUT_SECONDS: ${OUTBOUND_SEND_TIMEOUT_SECONDS:-2}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder
      args:
        - NODE_ENV=development
    container_name: mudai_frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  frontend_node_modules:
