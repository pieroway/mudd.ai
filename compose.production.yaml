services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-muduser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the production environment}
      POSTGRES_DB: ${POSTGRES_DB:-muddb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "false"
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the production environment}
      REDIS_URL: redis://redis:6379
      AI_PROVIDER: ${AI_PROVIDER:-fake}
      APP_ENV: production
      AUTH_SESSION_SECONDS: ${AUTH_SESSION_SECONDS:-86400}
      AUTH_ATTEMPT_LIMIT: ${AUTH_ATTEMPT_LIMIT:-20}
      AUTH_ATTEMPT_WINDOW_SECONDS: ${AUTH_ATTEMPT_WINDOW_SECONDS:-60}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TRUSTED_ORIGINS: ${PUBLIC_URL:?Set PUBLIC_URL to the external HTTPS origin}
      MAX_COMMAND_BYTES: ${MAX_COMMAND_BYTES:-4096}
      COMMAND_RATE_LIMIT: ${COMMAND_RATE_LIMIT:-10}
      COMMAND_RATE_WINDOW_SECONDS: ${COMMAND_RATE_WINDOW_SECONDS:-1}
      MAX_WEBSOCKET_CONNECTIONS: ${MAX_WEBSOCKET_CONNECTIONS:-250}
      CONNECTION_ATTEMPT_LIMIT: ${CONNECTION_ATTEMPT_LIMIT:-60}
      CONNECTION_ATTEMPT_WINDOW_SECONDS: ${CONNECTION_ATTEMPT_WINDOW_SECONDS:-60}
      MAX_TRACKED_CLIENT_ADDRESSES: ${MAX_TRACKED_CLIENT_ADDRESSES:-10000}
      OUTBOUND_SEND_TIMEOUT_SECONDS: ${OUTBOUND_SEND_TIMEOUT_SECONDS:-2}
      PYTHONDONTWRITEBYTECODE: "1"
    command: ["sh", "-lc", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --ws-max-size $${MAX_COMMAND_BYTES:-4096}"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - edge
      - data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${PUBLIC_URL:?Set PUBLIC_URL to the external HTTPS origin}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - edge

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      CADDY_HOST: ${CADDY_HOST:?Set CADDY_HOST to the public hostname}
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "--quiet", "--tries=1", "--spider", "https://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - edge

networks:
  edge:
  data:
    internal: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
