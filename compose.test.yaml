services:
  postgres_test:
    image: postgres:16-alpine
    container_name: mudai_postgres_test
    environment:
      POSTGRES_USER: muduser
      POSTGRES_PASSWORD: mudpass
      POSTGRES_DB: muddb_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muduser"]
      interval: 5s
      timeout: 5s
      retries: 3

  redis_test:
    image: redis:7-alpine
    container_name: mudai_redis_test
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 3

  backend_test:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mudai_backend_test
    environment:
      DATABASE_URL: postgresql+asyncpg://muduser:mudpass@postgres_test:5432/muddb_test
      REDIS_URL: redis://redis_test:6379
      AI_PROVIDER: fake
      APP_ENV: test
      DATABASE_POOL_ENABLED: "false"
      LOG_LEVEL: WARNING
    depends_on:
      postgres_test:
        condition: service_healthy
      redis_test:
        condition: service_healthy
    command: sh -lc "alembic upgrade head && pytest --cov=app --cov-report=term-missing -v"

  frontend_test:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder
    environment:
      CI: "true"
    command: sh -lc "npm run lint && npm run typecheck && npm run test:run && npm run build"
